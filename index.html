<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Восстанови цифровую связь</title>    <style>#game-loading{z-index:9000;color:#dceee7;text-align:center;overscroll-behavior:contain;background:radial-gradient(#284b53,#152b36);place-content:center;justify-items:center;gap:22px;padding:24px;font:500 clamp(18px,4vw,24px)/1.5 system-ui,sans-serif;transition:opacity .4s;display:grid;position:fixed;inset:0}#game-loading p{max-width:460px;margin:0}#game-loading.leaving{opacity:0;pointer-events:none}.loading-ring{border:3px solid #729c9638;border-top-color:#b5e6d4;border-radius:50%;width:48px;height:48px;animation:1.1s linear infinite loading-spin}#game-loading button{font:inherit;color:#143d44;cursor:pointer;background:#bfddd0;border:1px solid #9dc8bc;border-radius:9px;padding:12px 28px;font-size:17px}#game-loading button:focus-visible{outline-offset:4px;outline:3px solid #efc677}#game-loading[hidden],#game-loading [hidden]{display:none}@keyframes loading-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.loading-ring{animation:none}#game-loading{transition:none}}</style>
      <script>
      // Vite replaces the module tag, so listen before the generated entry loads.
      (() => {
        const isEntry = event => event.target instanceof HTMLScriptElement && event.target.type === 'module';
        const cleanup = () => {
          document.removeEventListener('error', failed, true);
          document.removeEventListener('load', loaded, true);
        };
        const loaded = event => { if (isEntry(event)) cleanup(); };
        const failed = event => {
          if (!isEntry(event)) return;
          cleanup();
          const show = () => {
            const panel = document.getElementById('game-loading');
            if (!panel) return;
            panel.hidden = false;
            panel.querySelector('p').textContent = 'Не удалось загрузить игру. Проверьте соединение и попробуйте снова.';
            panel.querySelector('.loading-ring').hidden = true;
            panel.querySelector('button').hidden = false;
            panel.setAttribute('aria-busy', 'false');
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, {once:true});
          else show();
        };
        document.addEventListener('error', failed, true);
        document.addEventListener('load', loaded, true);
      })();
    </script>
